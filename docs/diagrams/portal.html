<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1140px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · CSV Sales Pipeline</p>
    <h1>Uploading from the browser and opening report links</h1>
    <svg viewBox="0 0 980 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="portal-title portal-desc">
      <title id="portal-title">Portal: upload page and report links</title>
      <desc id="portal-desc">Architecture diagram showing the upload page calling API Gateway with its token and uploading straight to the S3 input bucket with a presigned form, and signed email links passing through API Gateway to the portal function, which reads job status from DynamoDB and redirects downloads to short-lived URLs on the S3 output bucket.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zone: AWS account -->
      <rect x="248" y="56" width="712" height="408" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="539" y="60" width="130" height="12" rx="2" fill="#f5f5f5"/>
      <text x="604" y="69" fill="rgba(45,49,66,0.40)" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.12em">AWS ACCOUNT</text>

      <!-- ============ ARROWS (behind boxes) ============ -->

      <!-- A: upload page -> input bucket (presigned POST, straight to S3) -->
      <path d="M120,200 V128 Q120,120 128,120 H780"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- B: upload page -> API Gateway (token) -->
      <line x1="200" y1="240" x2="280" y2="240" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- C: email link -> API Gateway (signed link) -->
      <path d="M200,400 H352 Q360,400 360,392 V280"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- D: API Gateway -> portal function (focal) -->
      <line x1="440" y1="240" x2="520" y2="240" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- E: portal -> job table -->
      <line x1="680" y1="240" x2="780" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- F: email link -> output bucket (download after the redirect) -->
      <line x1="200" y1="424" x2="780" y2="424" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- ============ ARROW LABELS ============ -->

      <rect x="420" y="100" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="464" y="109" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PRESIGNED POST</text>

      <rect x="216" y="220" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="229" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TOKEN</text>

      <rect x="368" y="330" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="404" y="339" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIGNED LINK</text>

      <rect x="456" y="220" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="229" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INVOKE</text>

      <rect x="694" y="220" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="730" y="229" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ STATUS</text>

      <rect x="528" y="404" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="580" y="413" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">5-MINUTE DOWNLOAD</text>

      <!-- ============ NODES ============ -->

      <!-- Upload page (user) -->
      <rect x="40" y="200" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="200" width="160" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="208" width="36" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="66" y="217" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="120" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Upload page</text>
      <text x="120" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tools/upload.html</text>
      <text x="120" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">local file</text>

      <!-- Email link (user) -->
      <rect x="40" y="360" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="360" width="160" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="368" width="36" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="66" y="377" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="120" y="400" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Email link</text>
      <text x="120" y="416" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">in the notification</text>
      <text x="120" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">valid 7 days</text>

      <!-- API Gateway (edge) -->
      <rect x="280" y="200" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="200" width="160" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="288" y="208" width="30" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="303" y="217" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="360" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">API Gateway</text>
      <text x="360" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">HTTP API · 3 routes</text>
      <text x="360" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rate-limited</text>

      <!-- Portal function (focal) -->
      <rect x="520" y="200" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="200" width="160" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="528" y="208" width="26" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="541" y="217" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FN</text>
      <text x="600" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Portal</text>
      <text x="600" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">checks token or HMAC</text>
      <text x="600" y="270" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">signs S3 URLs</text>

      <!-- Input bucket (store) -->
      <rect x="780" y="80" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="780" y="80" width="160" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="788" y="88" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="804" y="97" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">S3IN</text>
      <text x="860" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Input bucket</text>
      <text x="860" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">uploads/… only</text>
      <text x="860" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">≤ 10 MiB · 15 min</text>

      <!-- Job table (store) -->
      <rect x="780" y="200" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="780" y="200" width="160" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="788" y="208" width="30" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="803" y="217" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DDB</text>
      <text x="860" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Job table</text>
      <text x="860" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">status · counts</text>
      <text x="860" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">read only</text>

      <!-- Output bucket (store) -->
      <rect x="780" y="376" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="780" y="376" width="160" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="788" y="384" width="38" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="807" y="393" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">S3OUT</text>
      <text x="860" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Output bucket</text>
      <text x="860" y="436" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reports/{job_id}/*</text>
      <text x="860" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">private</text>

      <!-- ============ Legend strip ============ -->
      <line x1="40" y1="488" x2="940" y2="488" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="504" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="520" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="528" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal / compute</text>

      <rect x="164" y="520" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="184" y="528" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Store</text>

      <rect x="244" y="520" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="264" y="528" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Edge service</text>

      <rect x="356" y="520" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="376" y="528" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Person's browser</text>

      <line x1="484" y1="525" x2="512" y2="525" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="520" y="528" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTPS from the browser</text>

      <line x1="652" y1="525" x2="680" y2="525" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="688" y="528" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Only path into the function</text>

      <!-- ============ Footnotes ============ -->
      <text x="40" y="556" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">Token: the function keeps only its SHA-256. Links: HMAC-SHA256 of job, file and expiry, then a 302 to a 5-minute S3 URL.</text>
    </svg>
  </div>
</body>
</html>
