<!DOCTYPE html>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;

      justify-content: center;
      padding: 3rem 2rem;

    .frame { max-width: 1240px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);

      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }

</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · CSV Sales Pipeline</p>
    <h1>Event-driven CSV processing on AWS</h1>
    <svg viewBox="0 0 1100 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
      <title id="architecture-title">CSV sales pipeline AWS architecture</title>
      <desc id="architecture-desc">Architecture diagram showing an uploaded sales CSV moving from an S3 input bucket through an SQS queue to a Lambda processor, which claims the job and checks for duplicate content in DynamoDB, writes reports and curated rows to an S3 output bucket that Athena queries by month, and announces each outcome by SNS email and an EventBridge event, with a dead-letter queue, CloudWatch alarms and a dashboard covering failures.</desc>

        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <rect x="32" y="72" width="1052" height="352" rx="8"

      <rect x="493" y="76" width="130" height="12" rx="2" fill="#f5f5f5"/>
      <text x="558" y="85" fill="rgba(45,49,66,0.40)" font-size="8" font-family="'Geist Mono', monospace"

      <line x1="200" y1="240" x2="272" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- C: SQS processing -> Lambda (primary trigger, accent) -->
      <line x1="416" y1="240" x2="488" y2="240" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- D: Lambda -> DynamoDB -->
      <path d="M648,220 H688 Q696,220 696,212 V152 Q696,144 704,144 H744"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- E: Lambda -> S3 output -->
      <line x1="648" y1="240" x2="744" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
