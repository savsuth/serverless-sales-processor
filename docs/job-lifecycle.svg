<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="job-lifecycle-title job-lifecycle-desc">
      <title id="job-lifecycle-title">Job status lifecycle in the DynamoDB job table</title>
      <desc id="job-lifecycle-desc">State machine showing a job claimed into processing under a lease, then ending as completed, validation failed, or duplicate content; a retryable failure returns to processing on redelivery, while the fifth failed delivery or a code error dead-letters the job, which a redrive or the reprocess script sends back to processing.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ Band eyebrows ============ -->
      <text x="600" y="44" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">FINAL STATUSES</text>
      <text x="120" y="366" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">RECOVERY</text>

      <!-- ============ TRANSITIONS (behind boxes) ============ -->

      <!-- 1. start -> processing -->
      <line x1="66" y1="200" x2="120" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 2. processing -> completed (normal completion, accent) -->
      <path d="M320,176 H432 Q440,176 440,168 V104 Q440,96 448,96 H600"
            fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- 3. processing -> validation failed -->
      <line x1="320" y1="200" x2="600" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 4. processing -> duplicate content -->
      <path d="M320,224 H432 Q440,224 440,232 V296 Q440,304 448,304 H600"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 5. processing self-loop: expired lease taken over by another worker -->
      <path d="M188,160 V128 Q188,120 196,120 H244 Q252,120 252,128 V160"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- 6. processing -> failed (retryable) -->
      <line x1="160" y1="240" x2="160" y2="376" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- 7. failed -> processing (redelivery) -->
      <line x1="210" y1="376" x2="210" y2="240" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- 8. processing -> dead-lettered (code error: retrying cannot help) -->
      <path d="M304,240 V320 Q304,328 312,328 H502 Q510,328 510,336 V376"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- 9. failed -> dead-lettered (fifth failed delivery) -->
      <line x1="300" y1="416" x2="420" y2="416" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- 10. dead-lettered -> processing (redrive or reprocess), routed below and left of Failed -->
      <path d="M510,456 V472 Q510,480 502,480 H96 Q88,480 88,472 V232 Q88,224 96,224 H120"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- ============ TRANSITION LABELS (masked, 8-10px clear of the line) ============ -->

      <rect x="75" y="180" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="93" y="189" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLAIM</text>

      <rect x="486" y="76" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="524" y="85" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEW CONTENT</text>

      <rect x="482" y="180" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="522" y="189" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INVALID FILE</text>

      <rect x="486" y="284" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="524" y="293" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SAME SHA-256</text>

      <rect x="182" y="98" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="220" y="107" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LEASE EXPIRED</text>

      <!-- vertical segments: labels beside the line, 8px clear -->
      <rect x="96" y="300" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="124" y="309" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RETRYABLE</text>

      <rect x="218" y="300" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="250" y="309" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REDELIVERY</text>

      <rect x="372" y="308" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="404" y="317" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CODE ERROR</text>

      <rect x="326" y="396" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="360" y="405" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">5TH DELIVERY</text>

      <rect x="250" y="460" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="310" y="469" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REDRIVE · REPROCESS</text>

      <!-- ============ START ============ -->
      <circle cx="60" cy="200" r="6" fill="#2d3142"/>

      <!-- ============ STATES ============ -->

      <!-- Processing (focal: the lease holder) -->
      <rect x="120" y="160" width="200" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="120" y="160" width="200" height="80" rx="8" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <rect x="128" y="168" width="40" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="148" y="177" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACTIVE</text>
      <text x="220" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Processing</text>
      <text x="220" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lease token · 120 s</text>
      <text x="220" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one worker at a time</text>

      <!-- Completed -->
      <rect x="600" y="56" width="200" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="600" y="56" width="200" height="80" rx="8" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="608" y="64" width="36" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="626" y="73" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FINAL</text>
      <text x="700" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Completed</text>
      <text x="700" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">± rejected rows</text>
      <text x="700" y="128" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reports + curated rows</text>

      <!-- Validation failed -->
      <rect x="600" y="160" width="200" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="600" y="160" width="200" height="80" rx="8" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="608" y="168" width="36" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="626" y="177" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FINAL</text>
      <text x="700" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Validation failed</text>
      <text x="700" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">malformed · too large</text>
      <text x="700" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no valid rows · &gt;50% bad</text>

      <!-- Duplicate content -->
      <rect x="600" y="264" width="200" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="600" y="264" width="200" height="80" rx="8" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="608" y="272" width="36" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="626" y="281" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FINAL</text>
      <text x="700" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Duplicate content</text>
      <text x="700" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">points to original job</text>
      <text x="700" y="336" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no reports written</text>

      <!-- Failed (retryable) -->
      <rect x="120" y="376" width="180" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="120" y="376" width="180" height="80" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="128" y="384" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-width="0.8"/>
      <text x="146" y="393" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RETRY</text>
      <text x="210" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Failed</text>
      <text x="210" y="436" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AWS error · crash</text>
      <text x="210" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">waiting for original</text>

      <!-- Dead-lettered (retrying stopped) -->
      <rect x="420" y="376" width="180" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="420" y="376" width="180" height="80" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="428" y="384" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-width="0.8"/>
      <text x="448" y="393" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PARKED</text>
      <text x="510" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dead-lettered</text>
      <text x="510" y="436" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">retrying stopped</text>
      <text x="510" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">notification sent</text>

      <!-- ============ Callouts (margins) ============ -->
      <text x="120" y="44" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Every write after the claim must carry the lease token,</text>
      <text x="120" y="62" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">so a worker that lost its lease cannot overwrite a newer result.</text>
      <path d="M 150 70 Q 152 112 180 140" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="180" cy="140" r="2" fill="#2d3142"/>

      <text x="820" y="186" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">A redelivered event</text>
      <text x="820" y="204" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">never re-runs a final</text>
      <text x="820" y="222" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">job; reprocess.py</text>
      <text x="820" y="240" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">does, on request.</text>
      <path d="M 816 198 Q 808 198 802 200" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="800" cy="200" r="2" fill="#2d3142"/>

      <!-- ============ Legend strip ============ -->
      <line x1="32" y1="512" x2="928" y2="512" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="32" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="32" y="544" width="14" height="10" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="52" y="552" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Active, lease held</text>

      <rect x="164" y="544" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="184" y="552" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Final status</text>

      <rect x="268" y="544" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="288" y="552" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Not final: can be resumed</text>

      <line x1="432" y1="549" x2="460" y2="549" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="468" y="552" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Normal completion</text>

      <line x1="572" y1="549" x2="600" y2="549" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="608" y="552" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Failure / recovery</text>

      <circle cx="720" cy="549" r="5" fill="#2d3142"/>
      <text x="732" y="552" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">New S3 upload</text>
    </svg>
