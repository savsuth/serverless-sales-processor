<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="job-lifecycle-title job-lifecycle-desc">
      <title id="job-lifecycle-title">Job status lifecycle in the DynamoDB job table</title>
      <desc id="job-lifecycle-desc">State machine showing a job claimed into processing under a lease, then ending as completed, validation failed, or duplicate content, or dropping to a retryable failed status that redelivery reclaims, with an expired lease taken over by another worker and the fifth failed delivery going to the dead-letter queue.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ Band eyebrows ============ -->
      <text x="560" y="44" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">FINAL STATUSES</text>
      <text x="120" y="334" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">RECOVERY</text>

      <!-- ============ TRANSITIONS (behind boxes) ============ -->

      <!-- 1. start -> processing -->
      <line x1="66" y1="200" x2="120" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 2. processing -> completed (happy path, accent) -->
      <path d="M320,180 H392 Q400,180 400,172 V104 Q400,96 408,96 H560"
            fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- 3. processing -> validation failed -->
      <line x1="320" y1="200" x2="560" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 4. processing -> duplicate content -->
      <path d="M320,220 H392 Q400,220 400,228 V296 Q400,304 408,304 H560"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 5. processing -> failed (dashed: on failure) -->
      <line x1="188" y1="240" x2="188" y2="344" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- 6. failed -> processing (dashed: redelivery reclaims) -->
      <line x1="252" y1="344" x2="252" y2="240" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- 7. processing self-loop: expired lease taken over by another worker -->
      <path d="M188,160 V128 Q188,120 196,120 H244 Q252,120 252,128 V160"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- 8. failed -> dead-letter queue -->
      <line x1="320" y1="384" x2="472" y2="384" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- ============ TRANSITION LABELS (masked, 8-10px clear of the line) ============ -->

      <rect x="75" y="180" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="93" y="189" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLAIM</text>

      <rect x="446" y="76" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="484" y="85" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEW CONTENT</text>

      <rect x="442" y="180" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="482" y="189" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INVALID FILE</text>

      <rect x="446" y="284" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="484" y="293" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SAME SHA-256</text>

      <!-- vertical segments: labels beside the line, 8px clear -->
      <rect x="124" y="286" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="152" y="295" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RETRYABLE</text>

      <rect x="260" y="286" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="292" y="295" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REDELIVERY</text>

      <rect x="182" y="98" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="220" y="107" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LEASE EXPIRED</text>

      <rect x="362" y="364" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="396" y="373" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">5TH DELIVERY</text>

      <!-- ============ START / END ============ -->
      <circle cx="60" cy="200" r="6" fill="#2d3142"/>

      <circle cx="480" cy="384" r="8" fill="none" stroke="#2d3142" stroke-width="1"/>
      <circle cx="480" cy="384" r="5" fill="#2d3142"/>
      <text x="496" y="381" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">dead-letter queue</text>
      <text x="496" y="395" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">redrive to retry</text>

      <!-- ============ STATES ============ -->

      <!-- Processing (focal: the lease holder) -->
      <rect x="120" y="160" width="200" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="120" y="160" width="200" height="80" rx="8" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <rect x="128" y="168" width="40" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="148" y="177" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACTIVE</text>
      <text x="220" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Processing</text>
      <text x="220" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lease token · 120 s</text>
      <text x="220" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one worker at a time</text>

      <!-- Completed -->
      <rect x="560" y="56" width="200" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="560" y="56" width="200" height="80" rx="8" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="568" y="64" width="36" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="586" y="73" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FINAL</text>
      <text x="660" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Completed</text>
      <text x="660" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">± rejected rows</text>
      <text x="660" y="128" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reports + curated rows</text>

      <!-- Validation failed -->
      <rect x="560" y="160" width="200" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="560" y="160" width="200" height="80" rx="8" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="568" y="168" width="36" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="586" y="177" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FINAL</text>
      <text x="660" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Validation failed</text>
      <text x="660" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">malformed · too large</text>
      <text x="660" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no valid rows · &gt;50% bad</text>

      <!-- Duplicate content -->
      <rect x="560" y="264" width="200" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="560" y="264" width="200" height="80" rx="8" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="568" y="272" width="36" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="586" y="281" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FINAL</text>
      <text x="660" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Duplicate content</text>
      <text x="660" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">points to original job</text>
      <text x="660" y="336" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no reports written</text>

      <!-- Failed (retryable) -->
      <rect x="120" y="344" width="200" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="120" y="344" width="200" height="80" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="128" y="352" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-width="0.8"/>
      <text x="146" y="361" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RETRY</text>
      <text x="220" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Failed</text>
      <text x="220" y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AWS error · crash</text>
      <text x="220" y="416" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">waiting for original</text>

      <!-- ============ Callouts (margins) ============ -->
      <text x="120" y="44" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Every write after the claim must carry the lease token,</text>
      <text x="120" y="62" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">so a worker that lost its lease cannot overwrite a newer result.</text>
      <path d="M 150 70 Q 152 112 180 140" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="180" cy="140" r="2" fill="#2d3142"/>

      <text x="784" y="186" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">A finished job is never</text>
      <text x="784" y="204" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">reprocessed: a redelivered</text>
      <text x="784" y="222" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">event only re-sends the</text>
      <text x="784" y="240" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">notification.</text>
      <path d="M 780 198 Q 770 198 762 200" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="760" cy="200" r="2" fill="#2d3142"/>

      <!-- ============ Legend strip ============ -->
      <line x1="32" y1="452" x2="928" y2="452" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="32" y="468" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="32" y="484" width="14" height="10" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="52" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Active, lease held</text>

      <rect x="164" y="484" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="184" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Final status</text>

      <rect x="268" y="484" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="288" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Retryable status</text>

      <line x1="392" y1="489" x2="420" y2="489" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="428" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Normal completion</text>

      <line x1="532" y1="489" x2="560" y2="489" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="568" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Failure / recovery</text>

      <circle cx="680" cy="489" r="5" fill="#2d3142"/>
      <text x="692" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">New S3 upload</text>

      <circle cx="784" cy="489" r="7" fill="none" stroke="#2d3142" stroke-width="1"/>
      <circle cx="784" cy="489" r="4" fill="#2d3142"/>
      <text x="798" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Leaves the pipeline</text>
    </svg>
