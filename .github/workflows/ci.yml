name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Ruff + mypy + pytest + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Lets tests/test_terraform_schema.py run instead of skipping. The
      # wrapper is off so `terraform console` output stays plain.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: mypy
        run: mypy

      # Fails below the coverage floor in pyproject.toml
      # ([tool.coverage.report] fail_under).
      - name: pytest with coverage
        run: |
          pytest tests/ --cov --cov-report=term-missing --cov-report=markdown:coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"

      # Known vulnerabilities in the installed dependencies. The project
      # itself is installed editable and is not on PyPI, so it is skipped.
      - name: pip-audit
        run: pip-audit --skip-editable

  terraform-security:
    name: Terraform security scan (checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Skipped checks and their reasons are in .checkov.yaml and in
      # inline checkov:skip comments.
      - name: checkov
        run: |
          pip install checkov
          checkov --config-file .checkov.yaml --directory infra

  terraform:
    name: Terraform fmt + validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [infra, infra/bootstrap]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"

      - name: terraform fmt
        run: terraform fmt -check

      # No AWS credentials are used or needed here. -backend=false skips
      # remote state entirely, and `validate` only checks the
      # configuration's internal consistency (types, references,
      # required arguments) -- it never calls the AWS API. Deployment is
      # a separate, manually-triggered workflow (see deploy.yml); PRs
      # never deploy infrastructure.
      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate
