name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: pytest
        run: pytest tests/ -v

  terraform:
    name: Terraform fmt + validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [infra, infra/bootstrap]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"

      - name: terraform fmt
        run: terraform fmt -check

      # No AWS credentials are used or needed here. -backend=false skips
      # remote state entirely, and `validate` only checks the
      # configuration's internal consistency (types, references,
      # required arguments) -- it never calls the AWS API. Deployment is
      # a separate, manually-triggered workflow (see deploy.yml); PRs
      # never deploy infrastructure.
      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate
