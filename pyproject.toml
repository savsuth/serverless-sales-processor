[project]
name = "file-pipeline"
version = "1.0.0"
description = "Event-driven CSV sales processing pipeline (local + AWS Lambda)"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "boto3-stubs[s3,sqs,dynamodb,sns]>=1.34",
    "moto[dynamodb,s3,sns,sqs]>=5.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
file_pipeline = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_ignores = true

[tool.coverage.run]
source = ["file_pipeline"]

[tool.coverage.report]
fail_under = 90
show_missing = true
